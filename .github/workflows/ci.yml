name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# `shell: bash` makes GitHub run steps as `bash -eo pipefail`. Without it the default is `bash -e`,
# and a step that pipes into `tee` takes tee's exit status, so a failing command still shows green.
defaults:
  run:
    shell: bash

# Actions are pinned to commit SHAs (the version is in the trailing comment), so a moved tag cannot
# change what runs. Dependabot proposes the bumps; tests/test_ci_alignment.py fails if a pin is lost.

jobs:
  lint:
    # Skip PRs from forks: only this repository's own branches run CI.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    name: Lint, types and architecture
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff format
        run: uv run ruff format --check rag-sdk app
      - name: Ruff lint
        run: uv run ruff check rag-sdk app
      - name: Mypy (SDK)
        run: uv run mypy rag-sdk/rag_sdk
      - name: Import-linter (architecture contracts in pyproject.toml)
        run: uv run lint-imports

  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Both packages declare requires-python >=3.11 and the Docker image runs 3.13, so both are
        # tested. test_ci_alignment.py enforces that the floor and the image are in this list.
        python-version: ["3.11", "3.13"]
    name: test (python ${{ matrix.python-version }})
    env:
      OPENAI_API_KEY: test-key-ci
      PGVECTOR_TEST_DSN: postgresql://postgres:postgres@localhost:5432/postgres
      OPENSEARCH_TEST_URL: http://localhost:9200
      # Not available to Dependabot or fork PRs; the upload steps below skip when it is empty.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Throwaway single node; security is disabled for this CI service only.
      opensearch:
        image: opensearchproject/opensearch:2.19.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      # The coverage floors sit just below what the suites measure (SDK 97%, app 98%), so a real
      # drop fails here. Raise them as coverage grows; do not lower them to make a PR pass.
      - name: SDK tests with coverage
        run: >-
          uv run --frozen --python ${{ matrix.python-version }}
          pytest rag-sdk/tests --tb=short
          --cov=rag-sdk/rag_sdk --cov-report=term --cov-report=xml:rag-sdk-coverage.xml
          --cov-fail-under=95
      - name: App tests with coverage
        run: >-
          uv run --frozen --python ${{ matrix.python-version }}
          pytest app/tests --tb=short
          --cov=app/rag_app --cov-report=term --cov-report=xml:app-coverage.xml
          --cov-fail-under=95

      - name: Upload SDK coverage to Codecov
        if: matrix.python-version == '3.13' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: rag-sdk-coverage.xml
      - name: Upload app coverage to Codecov
        if: matrix.python-version == '3.13' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: app-coverage.xml

  secrets:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full history, not just the tip
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan history for secrets
        run: ./gitleaks git . --redact --verbose

  docker:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    name: Docker build and offline smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: rag-app:ci
      # The tokenizer vocabulary is baked into the image at build time; with no network it must
      # still load, or CHUNKING=recursive would fail in an offline deployment.
      - name: Smoke test (no network)
        run: |
          docker run --rm --network none rag-app:ci python -c "
          import rag_app.main
          from rag_sdk.tokenizer import openai_token_counter
          assert openai_token_counter('text-embedding-3-small')('hello world') == 2
          print('smoke ok')"

  # The single check to require in branch protection / a ruleset. Requiring each job separately
  # means touching repo settings every time a job is added or renamed; requiring this one means
  # adding the job to `needs:` below and nothing else (test_ci_alignment.py checks that it does).
  #
  # `if: always()` is load-bearing: without it a failed or skipped dependency skips this job too,
  # and GitHub treats a skipped required check as passing.
  #
  # Fail closed: only `success` counts. That includes `skipped`, so a fork PR (whose jobs are
  # deliberately skipped above) shows a red check instead of a false green. A maintainer re-runs
  # it from a branch in this repository.
  ci-success:
    needs: [lint, test, secrets, docker]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          failed=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"')
          if [ -n "$failed" ]; then
            echo "::error::Not every required job succeeded:"
            echo "$failed"
            exit 1
          fi
