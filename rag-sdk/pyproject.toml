[project]
name = "rag-sdk"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "aiolimiter>=1.1",
    "deepmerge>=1.1",
    "inflect>=7.0",
    "opentelemetry-api>=1.20",
    "tenacity>=8.2",
]

[project.optional-dependencies]
faiss = [
    "faiss-cpu>=1.8",
]
openai = [
    "openai>=1.0",
]
opensearch = [
    "opensearch-py[async]>=2.8",
]
pgvector = [
    "asyncpg>=0.29",
]
qdrant = [
    "qdrant-client>=1.10",
]
tokenizer = [
    "tiktoken>=0.7",
]

[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
fallback_version = "0.1.0"
tag_regex = "^rag-sdk-v(?P<version>.+)$"

[tool.setuptools.packages.find]
where = ["."]
include = ["rag_sdk*"]

[dependency-groups]
dev = [
    "faiss-cpu>=1.8",
    "mypy>=1.8",
    "opensearch-py[async]>=2.8",
    "opentelemetry-sdk>=1.20",
    "pytest>=7",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
