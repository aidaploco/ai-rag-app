[project]
name = "rag-app"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic-settings>=2.0",
    "pypdf[crypto]>=5.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "rag-sdk[openai,pgvector,qdrant,tokenizer]",
    "uvicorn[standard]>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
rag-sdk = { workspace = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["rag_app*"]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1",
    "httpx>=0.27",
    "pytest>=9.2.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
    "pyyaml>=6.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
